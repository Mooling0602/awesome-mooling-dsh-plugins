name: Cron probe

# A minimal scheduled workflow that exists only to answer one question: does a `schedule` trigger work in this repository
# at all? The registry workflow's hourly timer has never fired, and the cause could be its own definition or something
# repository-wide. This workflow does nothing but print a line, so if it also never fires the answer is the latter.
#
# Delete it once the question is answered.
on:
  schedule:
    # Every minute the platform allows, to make the answer arrive within minutes instead of hours.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "scheduled trigger fired at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "event: ${{ github.event_name }}"
