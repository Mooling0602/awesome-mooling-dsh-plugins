name: PR

# The run is named after the pull request it judges, but only when a comment asked for it. A `pull_request_target` run is
# already named after the pull request's title, which is the wording the submission is judged by and worth keeping visible;
# a comment run would otherwise be named after the comment, which says nothing about which pull request was checked.
# `pr-result.yml` reads this name back to find the pull request, because a comment run's `head_sha` is the tip of `main`
# rather than the pull request's head and cannot identify it.
#
# The leading `PR #` is quoted as part of a double-quoted scalar: a bare `#` in YAML starts a comment, and unquoted it would
# silently truncate the name to `PR`.
run-name: "${{ github.event.issue.number && format('PR #{0}', github.event.issue.number) || '' }}"

# Checks a pull request without publishing anything.
#
# `registry.yml` deploys the worker and writes KV on every push to main, so it is deliberately not triggered here: a pull
# request must be able to run the whole check suite without touching the deployed registry. This workflow runs the same
# checks up to the point of deployment and stops at a dry-run bundle, which is what catches a worker that would fail to
# build without spending a deploy on it.
#
# Nothing is committed and nothing is uploaded to KV. The build tree under `dists/` is produced and discarded, because
# both the registry data and the index are derived from the plugin metadata and from GitHub, not from files a branch
# carries.
#
# Every pull request runs, not just those targeting `main`, because a submission aimed at another branch still has to be
# seen in order to be rejected: `src/contrib/check.ts` checks the base branch, and a workflow that never ran could not
# report that a submission has no business targeting anything but `main`.
#
# `pull_request_target` rather than `pull_request`, and that choice is what makes the rules current.
#
# A `pull_request` run uses the workflow file carried by the pull request's *merge* commit, and that merge commit is built
# from the base commit the pull request was opened against. A pull request opened before a rule changed therefore keeps
# being judged by the rule that existed then, however many times it is re-run, until its branch is updated — which a
# contributor has no way of knowing to do. `pull_request_target` always loads this file from the default branch, so the
# checks that run are the ones `main` has right now, no matter how old the pull request is.
#
# The cost is that this trigger runs with a write token in the base repository's context, so the separation below is not
# decorative: the checked-out tree is the base commit, which supplies every file that gets *executed*, and the pull
# request contributes only `plugins/`, which is read as data. Nothing from the head commit is imported, sourced, or run.
#
# Every pull request runs, including drafts, because a draft has to be reported to its author so they can fix it before
# marking it ready, and because a submission aimed at another branch still has to be seen in order to be refused.
#
# A run is judged by the rules on `main`, so when a rule changes, or when a run failed for a reason outside the
# contribution, the pull request is stuck until something moves its branch. There are two ways to ask for another run, and
# they differ in one thing that matters:
#
# - A contributor comments exactly `/recheck`. This needs no write access, so anyone who can comment can use it,
#   including the author of a fork's pull request. It runs the same checks and reports them in the same comment, but it
#   cannot clear the required check that blocks merging: that check belongs to the run GitHub starts for the pull
#   request's own head commit, and a comment run checks out `main` and so reports against `main`.
# - A maintainer adds the `recheck` label. A `labeled` event under `pull_request_target` carries the pull request's head,
#   so this run creates its `Check` on that head and does clear the required check. The label is removed again at the end
#   of the run, which is what makes it usable more than once: adding a label a pull request already carries fires
#   nothing.
#
# Both exist because neither alone is enough: the comment is the only one a contributor can use, and the label is the only
# one that unblocks a fork's pull request, since a fork's branch does not exist in this repository and cannot be
# dispatched.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  issue_comment:
    types: [created]

# `contents: read` is all the checks need. The comment on a run is posted by `pr-result.yml`, which is a separate
# workflow listening on `workflow_run`, so nothing here writes to the repository.
#
# `pull-requests: write` is for two things: reading the pull request a `/recheck` comment belongs to, and taking the
# `recheck` label back off at the end of the run. Labels are served by the issues endpoints, but for a pull request GitHub
# accepts `pull-requests: write` there and *not* `issues: write` — measured: with `issues: write` granted, the same DELETE
# answered 403 `Resource not accessible by integration` while the run log listed `Issues: write`.
permissions:
  contents: read
  pull-requests: write

env:
  # The registry and index builds read each plugin repository's default branch and releases, so every step that talks to
  # GitHub needs this to stay inside the unauthenticated rate limit, which a shared CI address exhausts quickly.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check:
    name: Check
    # A comment only runs the check when it says exactly `/recheck` and sits on a pull request. `issue_comment` fires for
    # issue comments on ordinary issues too, and a comment on an issue has no pull request to judge. The comparison is an
    # exact whole-body match, because GitHub's expression syntax has no trim and no case folding to apply first: a comment
    # reading "please /recheck this" must not start a run, and neither must `/RECHECK`.
    #
    # A `labeled` event runs only for the `recheck` label, because every other label a maintainer adds — `plugins`, a
    # category, a triage marker — says nothing about wanting the checks run again, and re-checking on each of them would
    # spend three runs on one pull request.
    if: >-
      (github.event_name == 'pull_request_target' &&
      (github.event.action != 'labeled' || github.event.label.name == 'recheck')) ||
      (github.event.issue.pull_request != null && github.event.comment.body == '/recheck')
    runs-on: ubuntu-latest
    steps:
      # Which pull request is being judged, and where its head and base are.
      #
      # A `pull_request_target` run carries that in the event, and the values are used as they arrive; this covers the
      # `opened` and `labeled` paths alike, because both are `pull_request_target`. A `/recheck` run carries only an issue
      # number, so the same three facts are read back from the API instead, and everything below reads them from this step
      # rather than from the event. That keeps one set of `${{ }}` references working for every trigger instead of
      # duplicating every step.
      #
      # The head is re-read from the API rather than reused from any earlier value: a recheck is asked for precisely
      # because the pull request has moved on, so the freshest head is the only one worth judging.
      - name: Read the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          # A title is written by a contributor and reaches this script through the environment, never interpolated into
          # it: a title carrying a quote, a backtick or a `$` would otherwise be expanded by the shell before it was
          # written to the output. The same reason the checker receives it this way rather than as an inline argument.
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_REF: ${{ github.base_ref }}
          EVENT_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT" = "pull_request_target" ]; then
            {
              echo "number=$NUMBER"
              echo "head=$EVENT_HEAD"
              echo "base=$EVENT_BASE"
              echo "ref=$EVENT_REF"
              echo "title=$EVENT_TITLE"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/pulls/$NUMBER" > "$RUNNER_TEMP/pr.json"
          {
            echo "number=$NUMBER"
            echo "head=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")"
            echo "base=$(jq -r .base.sha "$RUNNER_TEMP/pr.json")"
            echo "ref=$(jq -r .base.ref "$RUNNER_TEMP/pr.json")"
            echo "title=$(jq -r .title "$RUNNER_TEMP/pr.json")"
          } >> "$GITHUB_OUTPUT"

      # The default branch as it stands right now, checked out at the workspace root. Everything that runs comes from
      # here: the scripts, the configuration, the type definitions, and the tests. A pull request cannot alter any of it.
      #
      # `github.sha` rather than the pull request's base commit, and the difference is the whole point. Under
      # `pull_request_target` the former is the tip of the default branch at run time, and under `issue_comment` it is the
      # same thing, so both triggers judge a submission by the newest rule that exists. The base commit the pull request
      # was opened against stops moving the moment it is opened: a submission reviewed a week later would still be judged
      # by the code of a week ago, and a fix pushed to `main` in between would not be in effect until the contributor
      # updated their branch.
      #
      # `fetch-depth: 0` fetches the whole history rather than a single commit, because the checker has to find the point
      # where the pull request branched off. A depth-1 checkout of each side leaves two commits with no shared ancestry,
      # and `git merge-base` then answers with nothing while still exiting successfully: the branch point silently becomes
      # the head, the diff comes out empty, and a real submission would be reported as touching no files. The repositories
      # here are small and the filter below skips the file contents anyway, so full history costs little.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none

      # The pull request's own commits, kept in a subdirectory and used for exactly one thing: its `plugins/` tree, which
      # the step below copies over the base one. `allow-unsafe-pr-checkout` is required because this is a
      # `pull_request_target` run and the checkout action refuses untrusted code there by default. The flag is safe here
      # only because nothing in that directory is executed: it is read as YAML, and it is deleted before any build runs.
      #
      # The history is fetched for the same reason as above: the branch point is only discoverable once both sides share
      # history, and the head is what the branch point is measured back from.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head }}
          path: .pr
          fetch-depth: 0
          filter: blob:none
          allow-unsafe-pr-checkout: true

      # The head tree exists only as a git object for the checker to read the submitted `plugin.yml` from, and only as a
      # source of `plugins/`. The working copy of the head is removed so that the build, the type check and the tests
      # below run against files that came from `main`: a submission that added a test, a dependency or a source file
      # would otherwise be silently included in its own judgement.
      #
      # The objects stay reachable because the branch point ties them together: `origin/main` and the fetched head are
      # now two tips within one repository, so removing the working copy no longer strands the commits.
      - name: Keep only the submitted plugins
        run: |
          rm -rf plugins
          cp -r .pr/plugins .
          rm -rf .pr

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      # Runs before anything is built, so a pull request that cannot be accepted fails in seconds instead of after a
      # full registry and index build.
      #
      # Both commits are named explicitly rather than diffed as `base...HEAD`. The two were fetched independently and
      # need no ancestry in common: `git diff` compares two trees, and `git log base..head` walks what the head reaches
      # that the base does not. A three-dot range would need a merge base, which two unrelated tips do not have.
      #
      # The checker itself comes from the base checkout at the workspace root, so the rules that judge a submission are
      # never the ones it supplied.
      #
      # `--target` is passed because a plugin submission may only target `main`; the check rejects one aimed elsewhere
      # rather than letting it through to a merge that could never publish.
      #
      # `--title` is passed and `--base` is not used for the message because a submission is squash-merged with its title
      # as the commit message, so the title is what names the plugin in the index. The title travels through the
      # environment rather than being interpolated into the script: it is written by a contributor, and a title carrying a
      # quote, a backtick or a `$` would otherwise be expanded by the shell before the checker ever saw it.
      - name: Check the pull request title and the submitted metadata
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          BASE_REF: ${{ steps.pr.outputs.ref }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
        run: node src/contrib/check.ts --base "$BASE_SHA" --head "$HEAD_SHA" --target "$BASE_REF" --title "$PR_TITLE"

      # The registry data is built first because the index is read from these packuments and the worker imports the
      # index, so `pnpm check` cannot type-check the worker until both exist. This is the same order `registry.yml` uses
      # for the same reason.
      - name: Build registry data
        run: pnpm registry

      - name: Build index
        run: ./build-index.sh

      # The generated READMEs are not checked here. They are produced from `plugins/` by `readme.yml`, which runs on a
      # push to `main` and commits the result, and the two files are flagged `skip-worktree` locally so a developer never
      # has them in front of them. Requiring a pull request to carry a regenerated copy would ask its author to produce
      # output that the repository hides from them locally and that CI rewrites after the merge anyway, and a fork cannot
      # commit the result back. The README therefore catches up on `main` rather than holding up the submission.
      - name: Typecheck
        run: pnpm check
      - name: Test
        run: pnpm test

      # A bundle that cannot be produced is a worker that cannot deploy. `wrangler deploy --dry-run` builds and validates
      # the whole worker without an account, so this needs no Cloudflare credential and cannot publish anything.
      - name: Verify the worker bundles
        run: pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

      # The `recheck` label is a request, not a state, so it is taken back off once the run has answered it. Without this
      # the label could only be used once: adding a label a pull request already carries fires no `labeled` event, so a
      # second recheck would do nothing until someone removed it by hand.
      #
      # `always()` because a failing run answered the request just as much as a passing one, and leaving the label on after
      # a failure would make the next attempt look like it had already been asked for.
      #
      # A 404 is the one answer that is not a problem: it means the label is already off, which is the state this step
      # exists to reach. Anything else is reported as a warning and swallowed, because the checks have already decided the
      # result and a label that would not come off is not worth turning a passing run red over — but it is *said*, rather
      # than hidden behind a successful exit, so the failure is visible if it ever happens.
      - name: Take the recheck label back off
        if: always() && github.event_name == 'pull_request_target' && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if gh api --method DELETE "repos/${{ github.repository }}/issues/$NUMBER/labels/recheck"; then
            echo "The recheck label is off again."
            exit 0
          fi
          status=$(gh api "repos/${{ github.repository }}/issues/$NUMBER/labels" --jq '[.[].name] | join(",")')
          echo "::warning::Could not remove the recheck label; the labels now read: $status"
