name: update-cf-worker

# Manually republish the CF Workers registry that serves the plugins dispatched as release tarballs.
#
# Run this from Actions → update-cf-worker → Run workflow when the worker, its KV data, or the `tarball` plugins change
# and no index rebuild is wanted. It does rebuild the packuments, so the index the registry job publishes is left
# untouched and may list older versions until that job runs again; trigger it when the index has to match a release.
on:
  workflow_dispatch:
    inputs:
      skip_kv:
        description: Deploy only the worker, leaving KV as it is
        type: boolean
        default: false
      registry_url:
        description: Worker URL to smoke-test afterwards; leave empty to skip the check
        type: string
        required: false
        default: https://mynpm.staringplanet.top
      # This workflow republishes whatever commit it was started on, which is the tip of `main` when the dispatch is
      # taken from the default branch. A dispatch taken from another branch, or one that waits in the shared queue long
      # enough for `main` to move, carries a tree `main` has already moved past, and deploying it would roll the
      # registry back to code nobody is running. That is sometimes exactly what is wanted, so it stays possible — by name,
      # with this input, rather than as an assumption about what a manual trigger means.
      rollback:
        description: Publish this run's commit even if main has moved on (an intentional rollback)
        type: boolean
        default: false

# The same group as `registry.yml`, and that is the point: both files deploy the same Cloudflare worker, and a
# concurrency group's name is unique across a repository rather than per workflow. Two names would mean no lock at all,
# and a manual run overlapping a push could then deploy the older tree over the newer one. Serialising them costs a wait
# and nothing else, because each run builds what it deploys.
#
# `queue: max` so that waiting runs are kept rather than replaced. The default holds one pending run and swaps it out on
# each new arrival, which would drop an earlier manual deploy without a trace: a run that never starts reports nothing.
concurrency:
  group: registry
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

# No workflow-level `env` on purpose. A workflow-level variable reaches every step, and `pnpm test` runs the test suite
# after contributed code has been merged. The steps that contact the Cloudflare account carry the pair themselves;
# `wrangler deploy --dry-run` needs neither, because it builds the worker without contacting the account.

jobs:
  update:
    name: Update worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The shared queue means this run can start long after it was triggered, and a checkout carries whatever commit
      # the dispatch selected. Publishing a commit that is no longer the tip of `main` would put the older tree in front
      # of the newer one — the same accidental rollback `registry.yml` guards against, and the two deploy the same
      # worker. The question is about `main`, so it is asked the same way here as there, and the answer is the same
      # input: a rollback is a thing a person asks for by name.
      #
      # A lookup that fails is not an answer, and the two are kept apart: publishing on "could not tell" is how an older
      # tree ends up in front of the newer one without anyone deciding that. The lookup is retried a bounded number of
      # times and then stops the run.
      #
      # Checked before anything is built, so a superseded run costs a checkout rather than a full build and, worse, a
      # KV write out of the free plan's daily quota.
      - name: Check that this run is still the tip of main
        id: fresh
        env:
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          if [ "$ROLLBACK" = "true" ]; then
            echo "A rollback was asked for, so this run publishes the commit it carries however far main has moved on."
            exit 0
          fi
          head=$(git rev-parse HEAD)
          # Three attempts, because the answer decides whether anything is published at all and a single dropped
          # connection is not an answer. It is still bounded: the point of asking is to publish soon, and a run that
          # waited minutes for a lookup has spent the time the lookup was meant to save.
          tip=''
          for attempt in 1 2 3; do
            tip=$(git ls-remote origin refs/heads/main | cut -f1) || tip=''
            [ -n "$tip" ] && break
            echo "Could not read refs/heads/main (attempt $attempt of 3)."
            sleep 5
          done
          if [ -z "$tip" ]; then
            echo "::error title=Nothing was published::refs/heads/main could not be read, so nothing says whether this run has been superseded — and publishing on a guess is exactly how an older tree ends up in front of the newer one. Nothing was deployed and no KV record was written. Re-run this workflow; if this commit is what should be published whatever main carries, ask for a rollback."
            exit 1
          fi
          if [ "$head" = "$tip" ]; then
            echo "This run carries the tip of main."
            exit 0
          fi
          echo "::warning title=Superseded run::This run carries $head, but main has moved on to $tip. Both workflows that deploy this worker would put the older tree back, so this one publishes nothing; re-run it from the tip of main, or ask for a rollback."
          # Failing rather than quietly skipping, unlike the push-triggered runs that share this queue. There a
          # superseded run has a newer run of itself queued behind it, so nothing is lost by saying so and stopping.
          # Here the run is the only one there is: skipping green would report a deploy that never happened, and the
          # person who asked for it would have no reason to look again. The error names both ways forward.
          echo "::error title=Nothing was published::This run carries $head, but main has moved on to $tip, so publishing it would roll the worker back. Nothing was deployed and no KV record was written. Re-run the workflow from the tip of main, or enable the rollback input if publishing this commit is what you meant."
          exit 1

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Rebuilt from the current `plugins/` tree on every run: a tarball plugin that released a new version since the
      # last deploy gets its packument refreshed here, so deploying the worker and refreshing KV cannot drift apart.
      - name: Build registry data
        run: pnpm registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The worker imports the index, so it has to exist before the checks and the bundling below.
      - name: Build index
        run: ./build-index.sh

      - run: pnpm check
      - run: pnpm test

      - name: Verify the worker bundles
        run: pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

      # wrangler does not expand `${...}` in wrangler.toml, so the namespace id is written into it here. The committed
      # file keeps the placeholder, which means a checkout can never deploy over the wrong namespace by accident.
      - name: Point the config at the namespace
        env:
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          test -n "$KV_NAMESPACE_ID" || { echo 'KV_NAMESPACE_ID is not set' >&2; exit 1; }
          sed -i "s|id = \"KV_NAMESPACE_ID\"|id = \"$KV_NAMESPACE_ID\"|" wrangler.toml
          grep -n 'id = ' wrangler.toml

      # The worker caches each proxy decision in KV. Those records are derived data, and a record written by an older
      # worker can outlive the bug that caused it: a past version refused packages a real install needed, and the
      # refusals had no expiry. This workflow is run by hand, which is the right moment to pay for a rebuild, because a
      # delete and a rewrite per record is real write traffic against a small daily quota.
      #
      # Skipped together with the packument upload, since both are KV writes and `skip_kv` asks for no KV traffic.
      - name: Drop cached proxy decisions
        if: inputs.skip_kv == false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler kv key list --binding REGISTRY --remote > "$RUNNER_TEMP/kv-keys.json"
          node src/registry/build.ts --cache-plan < "$RUNNER_TEMP/kv-keys.json"
          if [ "$(node -e 'console.log(require("./dists/registry/cache-delete.json").length)')" -gt 0 ]; then
            pnpm exec wrangler kv bulk delete dists/registry/cache-delete.json --binding REGISTRY --remote --force
          else
            echo 'no cached decisions to drop'
          fi

      # The worker goes out first, then its data.
      #
      # Uploading first was the original order, so that a new worker never answered before the packuments it serves were
      # in place. A day of deploys against the free plan exhausted the daily KV write quota, though, and because the
      # upload came first, no worker change could ship at all, including a fix that had nothing to do with KV. A worker
      # whose data is one release stale is a working worker: the previous packuments are still in KV and still resolve.
      # A worker that cannot deploy is not.
      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      # A failure here must fail the run. The free plan caps how many KV writes an account may make per day, so an
      # exhausted quota is a real operational fault: a plugin version published in this run is not served, and leaving
      # the run green would hide that. The cause is named explicitly instead, so the fix is obvious without reading
      # wrangler output.
      - name: Upload packuments to KV
        if: inputs.skip_kv == false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! pnpm exec wrangler kv bulk put dists/registry/kv.json --binding REGISTRY --remote; then
            echo '::error title=Packument upload failed::The registry data was not published. If the log above says the free usage limit was reached, the account has exhausted its daily KV write quota (Cloudflare error 10048). The worker is already deployed and still serves the packuments from the previous run, so existing plugins keep installing, but this release is incomplete. Re-run this workflow once the quota resets.'
            exit 1
          fi

      # A deploy that leaves the registry unreachable is worth failing on here rather than discovering it from a user's
      # failed install.
      - name: Smoke test
        if: inputs.registry_url != ''
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$REGISTRY_URL/dsh-hint-shell" > /dev/null; then
              echo "served a hosted packument"
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          echo "the registry did not serve a hosted packument" >&2
          exit 1
        env:
          REGISTRY_URL: ${{ inputs.registry_url }}

      - name: Summarize
        run: |
          packages=$(node -p 'Object.keys(require("./dists/registry/manifest.json").packages).length')
          kv=${{ inputs.skip_kv == false && 'performed' || 'skipped' }}
          smoke=${{ inputs.registry_url != '' && 'performed' || 'skipped' }}
          {
            echo "### update-cf-worker"
            echo
            echo "- KV upload: $kv"
            echo "- smoke test: $smoke"
            echo "- packages in dists/registry/manifest.json: $packages"
          } >> "$GITHUB_STEP_SUMMARY"
