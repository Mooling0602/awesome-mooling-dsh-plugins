name: Registry

# Builds the generated tree under dists/ and publishes the npm registry that serves the plugins dispatched as release
# tarballs. Runs on every push to main, and on demand.
#
# The two jobs are ordered by a real dependency: `build-index.sh` resolves the hosted plugins by asking the deployed
# registry for their packuments, so the worker and its KV data have to exist before the index can describe them.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: two runs publishing different packuments to the same KV namespace would leave the index and the
# registry describing different versions.
concurrency:
  group: registry
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Wrangler authenticates from these two variables, so no step needs `wrangler login` or a committed token.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  registry:
    name: Publish registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check
      - run: pnpm test

      # Reads each plugin's release assets, computes the tarball integrity from the exact bytes, and writes the
      # packuments plus the KV bulk file. The token keeps this inside the GitHub API rate limit.
      - name: Build registry data
        run: pnpm registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the worker bundles
        run: pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

      # wrangler does not expand `${...}` in wrangler.toml, so the namespace id is written into it here. The committed
      # file keeps the placeholder, which means a checkout can never deploy over the wrong namespace by accident.
      - name: Point the config at the namespace
        env:
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          test -n "$KV_NAMESPACE_ID" || { echo 'KV_NAMESPACE_ID is not set' >&2; exit 1; }
          sed -i "s|id = \"KV_NAMESPACE_ID\"|id = \"$KV_NAMESPACE_ID\"|" wrangler.toml
          grep -n 'id = ' wrangler.toml

      # Uploaded before the deploy: the packuments must be in place by the time the new worker starts answering, or a
      # client resolving a hosted package mid-deploy records a 404 in its own lockfile.
      - name: Upload packuments to KV
        run: pnpm exec wrangler kv bulk put dists/registry/kv.json --binding REGISTRY --remote

      - name: Deploy worker
        run: pnpm exec wrangler deploy

  index:
    name: Build index
    needs: registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Clones the harness at the matching tag, then regenerates dists/plugins.txt and dists/index.json. Every npm-form
      # entry it writes points at the registry published by the job above, which is why this job runs second.
      - name: Build index
        run: ./build-index.sh
        env:
          REGISTRY: ${{ vars.REGISTRY_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: dists
          path: dists/
          if-no-files-found: error
